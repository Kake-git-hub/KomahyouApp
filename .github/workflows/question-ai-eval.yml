name: Question AI eval

# 質問への AI 即時回答の評価(2026-10-16 オーナー指示)。確認用の 20 問(functions/src/questionAiEvalCases.ts)を
# 本番と同じ指示文・モデル・機械検査(functions/src/questionAiAnswer.ts)へ流し、回答を Job summary と成果物に出す。
# Firestore・教室データには一切触れない(AI を呼ぶだけ)。費用は 1 回 20 問で数円。
# 必要な secret: ANTHROPIC_API_KEY(deploy-functions.yml と共用)。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: question-ai-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Build functions
        run: npm --prefix functions run build

      - name: Run question AI eval
        working-directory: functions
        run: node tools/question-ai-eval.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-ai-eval-result
          path: functions/question-ai-eval-result.md
          if-no-files-found: ignore
